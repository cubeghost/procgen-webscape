  <script type="module">
    import "https://cdn.jsdelivr.net/npm/path-data-polyfill/+esm";
    import Warp from "https://cdn.jsdelivr.net/npm/warpjs/+esm";

    const isTouchDevice = window.matchMedia("(pointer: coarse)").matches;

    const smudgeRadius = isTouchDevice ? 150 : 200;
    const smudgeStrength = 0.33;

    [...document.querySelectorAll(".plastic")].forEach(plastic =>
      initPlastic(plastic)
    );

    function initPlastic(plastic) {
      const contents = plastic.querySelector("foreignObject#plastic-content");

      let mouseX = 0;
      let mouseY = 0;
      let lastMouseX = null;
      let lastMouseY = null;

      const warp = new Warp(plastic);
      warp.interpolate(10);

      let pointerEvents = {};

      plastic.addEventListener("pointerdown", function (e) {
        if (e.target.tagName === "A") return;
        pointerEvents[e.pointerId] = {
          lastX: e.clientX,
          lastY: e.clientY,
          x: e.clientX,
          y: e.clientY
        };
      });

      window.addEventListener("pointermove", (e) =>
        requestAnimationFrame(() => {
          plastic.classList.add("warping");
          const prevEvent = pointerEvents[e.pointerId];
          if (prevEvent) {
            pointerEvents[e.pointerId] = {
              lastX: prevEvent.x,
              lastY: prevEvent.y,
              x: e.clientX,
              y: e.clientY
            };
          }
        })
      );

      window.addEventListener("pointerup", function (e) {
        delete pointerEvents[e.pointerId];
        plastic.classList.remove("warping");
      });

      window.addEventListener("pointercancel", function (e) {
        delete pointerEvents[e.pointerId];
        plastic.classList.remove("warping");
      });

      function smudgeFactory(startX, startY, endX, endY, radius, strength) {
        const deltaX = endX - startX;
        const deltaY = endY - startY;

        return function smudge([x, y]) {
          const distX = endX - x;
          const distY = endY - y;
          const dist = Math.sqrt(distX ** 2 + distY ** 2);

          if (dist <= radius) {
            x += (strength * deltaX * (radius - dist)) / radius;
            y += (strength * deltaY * (radius - dist)) / radius;
          }

          return [x, y];
        };
      }

      window.addEventListener("pointermove", () =>
        requestAnimationFrame(() => {
          if (Object.keys(pointerEvents).length === 0) return;

          const origin = plastic.getBoundingClientRect();

          Object.values(pointerEvents).forEach(({ lastX, lastY, x, y }) => {
            warp.transform(
              smudgeFactory(
                lastX - origin.left,
                lastY - origin.top,
                x - origin.left,
                y - origin.top,
                smudgeRadius,
                smudgeStrength
              )
            );
          });

          // TODO debounce this
          if (contents) {
            const positionRef = plastic.querySelector("#plastic-content-position");
            if (positionRef) {
              const rect = positionRef.getBBox();
              console.log(rect)
              applyBounds(contents, rect);
            }
          }
        })
      );
    }

    function applyBounds(element, bounds) {
      element.setAttribute("x", bounds.x);
      element.setAttribute("y", bounds.y);
      element.setAttribute("width", bounds.width);
      element.setAttribute("height", bounds.height);
    }


    function fontSizePropertyToPx(value) {
      if (value.endsWith("px")) {
        return parseFloat(value.replace("px", ""));
      } else if (value.endsWith("rem")) {
        const rem = parseFloat(value.replace("rem", ""));
        const rootFontSize = parseFloat(
          getComputedStyle(document.documentElement).fontSize
        );
        return rem * rootFontSize;
      }
    }
  </script>
