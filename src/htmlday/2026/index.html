<!DOCTYPE html>

<head>
	<style>
		html,
		body {
			height: 100%;
		}

		body {
			font-family: monospace;
			color: white;
			background-image: linear-gradient(0deg, #e3b3f5 1%, #f3a5a9 8%, #ffdfae 15%, #60c0ff, #43bee7 100%);
			background-attachment: fixed;
		}

		main {
			padding: 2rem 1rem;
		}

		button.plant {
			width: var(--size, 8rem);
			height: var(--size, 8rem);
			border: 0;
			border-radius: 50%;
			display: block;
			padding: 0;
			margin-bottom: -2rem;
			cursor: pointer;
			overflow: hidden;
			opacity: 1;
		}

		@media (prefers-reduced-motion: no-preference) {
			button.plant {
				animation: hover 2s infinite alternate-reverse ease-in-out;
				animation-delay: var(--delay, 0s);
				transition: opacity 1s ease;
				transition-delay: calc(.2s + var(--delay, 0s));

				@starting-style {
					opacity: 0;
				}
			}
		}

		button.plant img {
			width: 100%;
			height: 100%;
			object-fit: cover;
		}

		button.plant:hover {
			box-shadow: 0 0 2rem #00587691;
		}

		button.plant-left {
			margin-right: auto;
		}

		button.plant-right {
			margin-left: auto;
		}

		@keyframes hover {
			from {
				transform: translateY(1.5rem)
			}

			to {
				transform: translateY(0)
			}
		}

		dialog {
			border: 0;
			padding: 1rem;
			height: max-content;
			width: max-content;
			max-width: min(100vw, 36rem);
			background: none;
			overflow: visible;
		}

		dialog figure {
			margin: 0;
			position: relative;
		}

		dialog figure img {
			width: max-content;
			max-width: min(calc(100vw - 2rem), 36rem);
			height: 100%;
			max-height: 80vh;
			border-radius: 2rem;
			box-shadow: 0 0 4rem 1rem #00587691;
		}

		dialog figure figcaption {
			background-image: linear-gradient(to right, var(--color, #fff) calc(100% - 3rem), transparent);
			z-index: 1;
			position: absolute;
			bottom: -0.5rem;
			right: -2rem;
			padding: 0.5rem 1rem;
			padding-right: 1.5rem;
			border-radius: 1rem 0 0 1rem;
		}

		.sun {
			width: 4rem;
			height: 4rem;
			border-radius: 50%;
			background: #ffe4d5;
			box-shadow: 0 0 1.5rem 0.75rem #ff75358c;
			position: fixed;
			bottom: 1rem;
			left: 50%;
			transform: translateX(-50%);
			z-index: -1;
		}

		.clouds span {
			background: #fff;
			padding: 0.5rem 1rem;
			color: #000;
			border-radius: 1rem;
			display: inline-block;
		}
	</style>
</head>

<body>
	<main style="text-align: center; max-width: 36rem; margin: 0 auto">
		<h1>today</h1>
		<section style="margin-bottom: 6rem;">
			<button class="plant plant-left" style="margin-left: 2rem; --size: 16rem; --delay: 1s" popovertarget="plant1"
				title="click me">
				<img src="1.JPG" alt="bush with many small leaves, pale green on the bottom" eleventy:formats="passthrough" />
			</button>
			<button class="plant plant-right" style="--size: 12rem; --delay: .4s" popovertarget="plant2" title="click me">
				<img src="2.JPG" alt="clovers with purple flowers" eleventy:formats="passthrough" />
			</button>
			<button class="plant plant-left" style="margin-left: 3rem; --size: 14rem; --delay: .1s" popovertarget="plant3"
				title="click me">
				<img src="3.JPG" alt="tiny clusters of flowers in white, pink, and pale yellow"
					eleventy:formats="passthrough" />
			</button>
			<button class="plant plant-right" style="margin-right: 2rem; --size: 16rem; --delay: 1.3s" popovertarget="plant4"
				title="click me">
				<img src="4.JPG" alt="plant topped with white spiky globes" eleventy:formats="passthrough" />
			</button>
			<button class="plant plant-left" style="--size: 14rem; --delay: .2s" popovertarget="plant5" title="click me">
				<img src="5.JPG" alt="stalks of sharp, green leaves" eleventy:formats="passthrough" />
			</button>
		</section>
		<section class="clouds" style="margin-bottom: 5rem">
			<span style="margin-right: min(5rem, 5vw)"><a href="https://2026.html.energy/">html day 2026</a> brought to you by
				the <a href="https://developer.mozilla.org/en-US/docs/Web/API/Popover_API/Using" target="_blank">popover
					API</a></span>
			<br />
			<span style="margin-left: min(15rem, 15vw); margin-top: -0.25rem;">made by <a href="/">cubeghost</a></span>
		</section>
		<div class="sun"></div>
	</main>
	<dialog id="plant1" popover>
		<figure>
			<img src="1.JPG" alt="bush with many small leaves, pale green on the bottom" eleventy:formats="passthrough" />
			<figcaption style="--color: #85d69b">purple willow...?</figcaption>
		</figure>
	</dialog>
	<dialog id="plant2" popover>
		<figure>
			<img src="2.JPG" alt="clovers with purple flowers" eleventy:formats="passthrough" />
			<figcaption style="--color: #e373b8">red clover</figcaption>
		</figure>
	</dialog>
	<dialog id="plant3" popover>
		<figure>
			<img src="3.JPG" alt="tiny clusters of flowers in white, pink, and pale yellow" eleventy:formats="passthrough" />
			<figcaption style="--color: #f37f93">yarrow</figcaption>
		</figure>
	</dialog>
	<dialog id="plant4" popover>
		<figure>
			<img src="4.JPG" alt="plant topped with white spiky globes" eleventy:formats="passthrough" />
			<figcaption style="--color: #dee9de">rattlesnake master...?</figcaption>
		</figure>
	</dialog>
	<dialog id="plant5" popover>
		<figure>
			<img src="5.JPG" alt="stalks of sharp, green leaves" eleventy:formats="passthrough" />
			<figcaption style="--color: goldenrod">goldenrod</figcaption>
		</figure>
	</dialog>
</body>
